# Configuration pour l'application de trading boursier

# Liste des actions à surveiller
stocks:
  - AAPL
  - GOOGL
  - MSFT
  - TSLA
  - AMZN

# Paramètres des indicateurs techniques
indicators:
  # RSI (Relative Strength Index)
  rsi:
    period: 14
    oversold: 30    # Signal d'achat potentiel
    overbought: 70  # Signal de vente potentiel

  # MACD (Moving Average Convergence Divergence)
  macd:
    fast_period: 12
    slow_period: 26
    signal_period: 9

  # Moyennes mobiles
  moving_averages:
    short_period: 20   # MA court terme
    long_period: 50    # MA long terme

# Paramètres de surveillance
monitoring:
  interval_minutes: 15  # Vérifier toutes les 15 minutes
  market_hours_only: true  # Surveiller uniquement pendant les heures de marché

# Paramètres d'alerte
alerts:
  # Types d'alertes à activer
  rsi_signals: true
  macd_signals: true
  moving_average_crossover: true
  price_breakout: true

  # Seuils personnalisés
  min_signal_strength: 0.6  # Score minimum pour déclencher une alerte (0-1)
