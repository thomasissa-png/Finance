# ============================================================================
# PARAMÈTRES DE BACKTESTING
# ============================================================================
backtesting:
  # Période d'analyse
  days_history: 20

  # Objectif de trading
  target_gain_percent: 1.0      # Objectif de gain : 1%
  max_loss_percent: 0.5         # Stop loss : -0.5%

  # Horaires de trading (heure de Paris)
  market_open: "09:00"
  market_close: "17:30"

  # Critères de sélection (ajustés pour multi-actifs)
  min_volume: 10000             # Volume minimum quotidien (réduit pour forex/indices)
  min_volatility: 0.3           # Volatilité minimum (%) - réduit pour forex
  max_volatility: 5.0           # Volatilité maximum (%) - augmenté pour forex/commodities

# Indicateurs techniques à calculer
indicators:
  # Tendance
  - RSI_14
  - MACD
  - SMA_5
  - SMA_10
  - SMA_20
  - EMA_5
  - EMA_10

  # Volatilité
  - ATR_14
  - BOLLINGER_BANDS

  # Volume
  - VOLUME_SMA_20
  - VOLUME_RATIO

  # Momentum
  - MOMENTUM_10
  - ROC_10
  - STOCHASTIC

  # Support/Résistance
  - SUPPORT_RESISTANCE

# ============================================================================
# FILTRES POUR SÉLECTION QUOTIDIENNE
# ============================================================================
selection_criteria:
  # Momentum positif
  rsi_range: [35, 65]           # RSI dans une zone neutre/légèrement haussière (élargi pour forex)

  # Volatilité optimale pour 1% de gain
  volatility_min: 0.5           # Réduit pour inclure plus d'actifs
  volatility_max: 4.0           # Augmenté pour forex et commodities

  # Volume au-dessus de la moyenne
  volume_ratio_min: 0.8         # Réduit car forex/indices ont des patterns différents

  # Tendance court terme
  price_above_sma5: false       # Désactivé pour permettre trading contre-tendance

# ============================================================================
# CATÉGORIES D'ACTIFS (pour filtrage et affichage)
# ============================================================================
asset_categories:
  actions: "Actions Euronext Paris"
  metals: "Métaux Précieux"
  forex: "Devises (Forex)"
  commodities: "Matières Premières"
  indices: "Indices Boursiers"
