<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3F5F9"/>
      <stop offset="100%" stop-color="#E8ECF3"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)" stroke="#D1D5E0" stroke-width="0.5"/>
  <!-- Grid lines -->
  <line x1="10" y1="48" x2="54" y2="48" stroke="#C5CAD6" stroke-width="1"/>
  <line x1="10" y1="38" x2="54" y2="38" stroke="#D8DCE6" stroke-width="0.5" opacity="0.6"/>
  <line x1="10" y1="28" x2="54" y2="28" stroke="#D8DCE6" stroke-width="0.5" opacity="0.6"/>
  <line x1="10" y1="18" x2="54" y2="18" stroke="#D8DCE6" stroke-width="0.5" opacity="0.6"/>
  <!-- Candlesticks -->
  <line x1="16" y1="22" x2="16" y2="42" stroke="#EF4444" stroke-width="1"/>
  <rect x="13" y="26" width="6" height="10" rx="1" fill="#EF4444"/>
  <line x1="26" y1="30" x2="26" y2="46" stroke="#EF4444" stroke-width="1"/>
  <rect x="23" y="32" width="6" height="8" rx="1" fill="#EF4444"/>
  <line x1="36" y1="18" x2="36" y2="40" stroke="#10B981" stroke-width="1"/>
  <rect x="33" y="22" width="6" height="12" rx="1" fill="#10B981"/>
  <line x1="46" y1="12" x2="46" y2="34" stroke="#10B981" stroke-width="1"/>
  <rect x="43" y="14" width="6" height="14" rx="1" fill="#10B981"/>
  <!-- Trend line -->
  <polyline points="16,30 26,38 36,26 46,16" fill="none" stroke="url(#line)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <!-- Target dot (OneShot) -->
  <circle cx="46" cy="16" r="3" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.9"/>
  <circle cx="46" cy="16" r="1" fill="#F59E0B" opacity="0.9"/>
</svg>
