name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout freezegun

      - name: Run tests (fast suite — fails on first 5 errors)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -m pytest backend/tests/ \
            --tb=short \
            --maxfail=5 \
            -q \
            --ignore=backend/tests/test_full_year_4teams.py \
            --ignore=backend/tests/test_one_month_pipeline.py \
            --ignore=backend/tests/test_full_system.py
