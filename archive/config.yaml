# ============================================================================
# PARAMÈTRES DE BACKTESTING
# ============================================================================
backtesting:
  # Période d'analyse
  days_history: 20

  # Objectif de trading
  target_gain_percent: 1.0      # Objectif de gain : 1%
  max_loss_percent: 0.5         # Stop loss : -0.5%

  # Horaires de trading (heure de Paris)
  market_open: "09:00"
  market_close: "17:30"

  # Critères de sélection (ajustés pour multi-actifs)
  min_volume: 10000             # Volume minimum quotidien (réduit pour forex/indices)
  min_volatility: 0.3           # Volatilité minimum (%) - réduit pour forex
  max_volatility: 5.0           # Volatilité maximum (%) - augmenté pour forex/commodities

# Indicateurs techniques à calculer
indicators:
  # Tendance
  - RSI_14
  - MACD
  - SMA_5
  - SMA_10
  - SMA_20
  - EMA_5
  - EMA_10

  # Volatilité
  - ATR_14
  - BOLLINGER_BANDS

  # Volume
  - VOLUME_SMA_20
  - VOLUME_RATIO

  # Momentum
  - MOMENTUM_10
  - ROC_10
  - STOCHASTIC

  # Support/Résistance
  - SUPPORT_RESISTANCE

# ============================================================================
# FILTRES POUR SÉLECTION QUOTIDIENNE
# ============================================================================
selection_criteria:
  # Momentum positif
  rsi_range: [35, 65]           # RSI dans une zone neutre/légèrement haussière (élargi pour forex)

  # Volatilité optimale pour 1% de gain
  volatility_min: 0.5           # Réduit pour inclure plus d'actifs
  volatility_max: 4.0           # Augmenté pour forex et commodities

  # Volume au-dessus de la moyenne
  volume_ratio_min: 0.8         # Réduit car forex/indices ont des patterns différents

  # Tendance court terme
  price_above_sma5: false       # Désactivé pour permettre trading contre-tendance

# ============================================================================
# CATÉGORIES D'ACTIFS (pour filtrage et affichage)
# ============================================================================
asset_categories:
  actions: "Actions Euronext Paris"
  metals: "Métaux Précieux"
  forex: "Devises (Forex)"
  commodities: "Matières Premières"
  indices: "Indices Boursiers"

# ============================================================================
# FONCTION 2: SÉLECTION DE TURBOS SOCIÉTÉ GÉNÉRALE
# ============================================================================
turbos:
  # Activation de la fonction turbos
  enabled: true

  # URL de base du site Société Générale
  base_url: "https://produits-de-bourse.societegenerale.com"

  # Critères de sélection des turbos
  selection:
    # Levier préféré (range)
    leverage_min: 5
    leverage_max: 15
    leverage_optimal: 10       # Levier idéal pour objectif +1% → +10%

    # Distance à la barrière (sécurité)
    barrier_distance_min: 10.0  # Minimum 10% de distance pour éviter désactivation

    # Échéance minimale
    min_days_to_expiry: 30      # Au moins 1 mois avant échéance

    # Spread maximum acceptable
    max_spread_percent: 0.5     # Spread max 0.5%

  # Mapping des symboles vers les sous-jacents SG
  # Format: "SYMBOL": "Nom du sous-jacent sur SG"
  underlying_mapping:
    # Actions Euronext Paris
    "MC.PA": "LVMH"
    "OR.PA": "L'OREAL"
    "AI.PA": "AIR LIQUIDE"
    "SAN.PA": "SANOFI"
    "TTE.PA": "TOTALENERGIES"
    "BNP.PA": "BNP PARIBAS"
    "SU.PA": "SCHNEIDER ELECTRIC"
    "SAF.PA": "SAFRAN"
    "RMS.PA": "HERMES"
    "CS.PA": "AXA"
    "CAP.PA": "CAPGEMINI"
    "VIE.PA": "VEOLIA"
    "DG.PA": "VINCI"
    "EN.PA": "BOUYGUES"
    "RI.PA": "PERNOD RICARD"

    # Indices (si disponibles)
    "^FCHI": "CAC 40"
    "^GSPC": "S&P 500"
    "^DJI": "DOW JONES"
    "^IXIC": "NASDAQ"
    "^GDAXI": "DAX"

  # Cache des turbos (évite de scraper à chaque fois)
  cache:
    enabled: true
    duration_minutes: 60        # Durée de validité du cache (1 heure)
