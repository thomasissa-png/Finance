<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Agent Trading{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-brand">
            <span class="nav-icon">&#9889;</span>
            <span class="nav-title">Agent Trading</span>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">
                <span class="nav-link-icon">&#128200;</span>
                Dashboard
            </a>
            <a href="/trading" class="nav-link {% if request.endpoint == 'trading' %}active{% endif %}">
                <span class="nav-link-icon">&#128176;</span>
                Trading
            </a>
            <a href="/memoire" class="nav-link {% if request.endpoint == 'memoire' %}active{% endif %}">
                <span class="nav-link-icon">&#128218;</span>
                Memoire
            </a>
        </div>
        <div class="nav-status">
            <span class="status-dot online"></span>
            <span id="status-text">Online</span>
            <span id="clock" class="nav-clock">--:--:--</span>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <span>Agent Trading v2.0</span>
            <span id="market-status">Chargement...</span>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
