<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bgGrad)"/>

  <!-- Trading chart line (uptrend) -->
  <polyline
    points="4,22 8,18 12,20 16,14 20,16 24,10 28,6"
    fill="none"
    stroke="url(#lineGrad)"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Dot at the end -->
  <circle cx="28" cy="6" r="2.5" fill="#10b981"/>

  <!-- Small candles for trading feel -->
  <rect x="6" y="24" width="2" height="4" rx="0.5" fill="#10b981" opacity="0.6"/>
  <rect x="12" y="25" width="2" height="3" rx="0.5" fill="#ef4444" opacity="0.6"/>
  <rect x="18" y="23" width="2" height="5" rx="0.5" fill="#10b981" opacity="0.6"/>
  <rect x="24" y="24" width="2" height="4" rx="0.5" fill="#10b981" opacity="0.6"/>
</svg>
